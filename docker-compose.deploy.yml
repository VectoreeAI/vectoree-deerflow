# 服务器上拉镜像启动，不在机器上编译镜像。
#   docker compose -f docker-compose.deploy.yml up -d --no-build
#
# 宿主机 HTTP 入口默认 127.0.0.1:5174，比 vectoree-starter 的 5173 大 1，
# 转发到容器内 Nginx 的 2026。本地 make up 仍使用 2026。

name: vectoree-deerflow

services:
  redis:
    image: redis:7-alpine
    container_name: vectoree-deerflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - deer-flow
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vectoree-deerflow-nginx
    ports:
      - "127.0.0.1:${DEERFLOW_WEB_PORT:-5174}:2026"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      frontend:
        condition: service_started
      gateway:
        condition: service_healthy
    networks:
      - deer-flow
    restart: unless-stopped

  frontend:
    image: ${DEERFLOW_FRONTEND_IMAGE:-deerflow-frontend:unset}
    container_name: vectoree-deerflow-frontend
    ports:
      - "127.0.0.1:53682:53682"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - DEER_FLOW_INTERNAL_AUTH_TOKEN=${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}
      - VECTOREE_LINK_CALLBACK_PORT=53682
      - DEPLOY_MODE=${DEPLOY_MODE:-local}
    networks:
      - deer-flow
    restart: unless-stopped

  gateway:
    image: ${DEERFLOW_GATEWAY_IMAGE:-deerflow-gateway:unset}
    container_name: vectoree-deerflow-gateway
    command: sh -c "cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    volumes:
      - ./config.yaml:/app/backend/config.yaml:ro
      - ./extensions_config.json:/app/backend/extensions_config.json
      - ./skills:/app/skills:ro
      - deerflow-data:/app/backend/.deer-flow
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_DOTENV_PATH=/app/.env
      - DEER_FLOW_STREAM_BRIDGE_REDIS_URL=${DEER_FLOW_STREAM_BRIDGE_REDIS_URL:-redis://redis:6379/0}
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_INTERNAL_AUTH_TOKEN=${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}
      - DEER_FLOW_HOST_BASE_DIR=/app/backend/.deer-flow
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,redis,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,redis,host.docker.internal
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - deer-flow
    restart: unless-stopped

volumes:
  redis-data:
  deerflow-data:

networks:
  deer-flow:
    driver: bridge
